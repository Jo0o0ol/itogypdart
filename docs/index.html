<!DOCTYPE html>
<html>
<head>
  <base href="/itogypdart/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BeanHouse — информационная система кофейни">
  <title>BeanHouse</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f8f3ed;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #5d4037;
      background: #f8f3ed;
      z-index: 9999;
    }
    .loading-card { text-align: center; }
    .cup { font-size: 48px; margin-bottom: 8px; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 18px auto;
      border-radius: 50%;
      border: 4px solid rgba(93,64,55,.18);
      border-top-color: #7a4e32;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="cup">☕</div>
      <strong>BeanHouse</strong>
      <div class="spinner"></div>
      <div>Загрузка кофейни…</div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('app-loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
